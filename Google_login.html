<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>차유나</title>
    <link rel="stylesheet" href="./Google_login.css">
</head>
<body>
    <form action="다음페이지" method="get">
    <div class="card">
        <div class="left">
            <img src="./resource/images/image.png">
            <p class="login">로그인</p>
            <p class="t2">Google 계정 사용</p>
        </div>

        <div class="right">
            <input 
            class="id"
            type="text" 
            placeholder="&nbsp;&nbsp;&nbsp;이메일 또는 휴대전화"
            required>
            <br/>
            <a href="https://accounts.google.com/signin/v2/usernamerecovery?continue=https%3A%2F%2Fwww.google.com%3Fhl%3Dko&dsh=S1981675618%3A1789518564678589&ec=GAlA8wE&flowEntry=AddSession&flowName=GlifWebSignIn&hl=ko">이메일을 잊으셨나요?</a>
            <p class="guest_t">내 컴퓨터가 아닌가요? 게스트 모드를 사용하여 비공개로 로그인하세요.<a href="https://support.google.com/chrome/answer/6130773?hl=ko" class="guest_h">게스트 모드 사용 방법 자세히 알아보기</a></p>
            
            <br/>

            <div class="button_g">
                <a href="게정만들기" class="account">계정 만들기</a>
                <button type="submit" class="next">다음</button>
            </div>

        </div>
    </div>

    </form>

</body>
</html>
